      - name: Create Android project
        run: |
          npx cap add android

          copy_icon() {
            density="$1"
            source_density="$2"
            cp "assets/android-icons/ic_launcher_${source_density}.png" \
              "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
          }

          copy_icon mdpi mdpi
          copy_icon hdpi hdpi
          copy_icon xhdpi xhdpi
          copy_icon xxhdpi xxhdpi
          copy_icon xxxhdpi xxxhdpi

          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KP-DEX-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
