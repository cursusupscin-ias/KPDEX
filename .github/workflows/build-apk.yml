name: Build KP DEX APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'assets/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npm install --save-dev @capacitor/assets

          mkdir -p www
          cp index.html www/index.html

          if [ -d assets ]; then
            cp -R assets www/assets
          fi

          cp assets/icon.png assets/icon-only.png

      - name: Configure KP DEX
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.cursusupscin.kpdex",
            "appName": "KP DEX",
            "webDir": "www"
          }
          EOF

      - name: Generate Android launcher icons
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Verify launcher resources
        run: |
          set -e
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          echo "Android adaptive launcher icon resources verified."

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KP-DEX-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
