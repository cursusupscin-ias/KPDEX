name: Build KP DEX APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'assets/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir -p www
          cp index.html www/index.html

          if [ -d assets ]; then
            cp -R assets www/assets
          fi

      - name: Configure KP DEX
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.cursusupscin.kpdex",
            "appName": "KP DEX",
            "webDir": "www"
          }
          EOF

      - name: Create Android project
        run: |
          npx cap add android

          RES="android/app/src/main/res"

          copy_icon() {
            density="$1"
            source_density="$2"
            source="assets/android-icons/ic_launcher_${source_density}.png"
            target="$RES/mipmap-${density}/ic_launcher.png"

            if [ ! -f "$source" ]; then
              echo "Missing launcher icon: $source"
              exit 1
            fi

            mkdir -p "$RES/mipmap-${density}"
            cp "$source" "$target"
          }

          copy_icon mdpi mdpi
          copy_icon hdpi hdpi
          copy_icon xhdpi xhdpi
          copy_icon xxhdpi xxhdpi
          copy_icon xxxhdpi xxxhdpi

          npx cap sync android

      - name: Verify launcher icons
        run: |
          set -e
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            file="android/app/src/main/res/mipmap-${density}/ic_launcher.png"
            test -s "$file"
            echo "Verified $file"
          done

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KP-DEX-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
